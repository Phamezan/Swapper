name: Windows Installer

on:
  workflow_dispatch:
  # Pushing an annotated tag vX.Y.Z publishes a release; the tag message is
  # the release notes.
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The tag must name the version being built, because latest.json points
      # at the installer under that tag's release.
      - name: Read release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --force origin "+${GITHUB_REF}:${GITHUB_REF}"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Use an annotated tag: its message becomes the release notes"
            exit 1
          fi

      - name: Verify bundled Deceive release
        shell: pwsh
        run: |
          $actual = (Get-FileHash 'src-tauri/resources/Deceive.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '25dc5427affed66aa38ec1d9103ffa1a47256dab4e698bef32543fbf0cf3d2e5') {
            throw "Bundled Deceive.exe does not match the official v1.18.0 release"
          }

      - name: Verify bundled Korean font files
        shell: pwsh
        run: |
          $expected = @{
            'src-tauri/resources/korean-font.fantome' = '23f0e309c4e89e7f2da12bc5c82c833b9b7ed53d80b40af03b68f6b9ed3eefb0'
          }
          foreach ($file in $expected.Keys) {
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$file]) {
              throw "Bundled $file does not match the Korean font files shipped by Swapper"
            }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-msvc

      - run: npm ci

      # Updater signing is additive: with TAURI_SIGNING_PRIVATE_KEY set the build
      # also produces the signed updater artifacts (latest.json + .sig); without
      # it the workflow builds exactly as before.
      - name: Detect updater signing key
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # A release without latest.json would become "latest" and break
            # update checks for everyone, so tagged builds must be signed.
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to publish a release"
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable updater artifacts
        if: steps.signing.outputs.signed == 'true'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle.createUpdaterArtifacts = true;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');

      - name: Build Swapper
        if: steps.signing.outputs.signed != 'true'
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Build Swapper (signed updater artifacts)
        if: steps.signing.outputs.signed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Generate latest.json
        if: steps.signing.outputs.signed == 'true'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const version = config.version;
          const bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis';
          const installer = `Swapper_${version}_x64-setup.exe`;
          const notes = fs.existsSync('release-notes.md')
            ? fs.readFileSync('release-notes.md', 'utf8').trim()
            : '';
          const latest = {
            version,
            notes,
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': {
                signature: fs.readFileSync(`${bundle}/${installer}.sig`, 'utf8').trim(),
                url: `https://github.com/Phamezan/Swapper/releases/download/v${version}/${installer}`,
              },
            },
          };
          fs.writeFileSync(`${bundle}/latest.json`, JSON.stringify(latest, null, 2) + '\n');

      - uses: actions/upload-artifact@v4
        with:
          name: Swapper-Windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload updater artifacts
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Swapper-Windows-Updater
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Swapper-Release-Notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Deceive is GPL-3.0: every release ships the source of the bundled
      # upstream tag. The hash pins the archive previous releases shipped.
      - name: Fetch Deceive source
        run: |
          curl -fsSL -o dist/Deceive-v1.18.0-source.zip \
            https://github.com/molenzwiebel/Deceive/archive/refs/tags/v1.18.0.zip
          echo "9d1e34249a89cbd404523db83fed553c89273c40df074b73121766d660dda255  dist/Deceive-v1.18.0-source.zip" | sha256sum -c -

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          installer=$(ls Swapper_*_x64-setup.exe)
          sha256sum "$installer" Deceive-v1.18.0-source.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Swapper $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "$installer" latest.json Deceive-v1.18.0-source.zip SHA256SUMS.txt
