<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720" role="img" aria-labelledby="title description">
  <title id="title">Swapper phone remote preview</title>
  <desc id="description">Illustration of the phone champion selection screen with connection status and controls.</desc>
  <style>
