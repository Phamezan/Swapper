[package]
name = "swapper"
version = "0.5.0"
license = "MIT"
description = "Tiny Riot account switcher for the Windows tray"
authors = ["Phamezan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swapper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sysinfo = "0.37"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# COM interfaces for the network category and Windows Firewall rules, so no
# PowerShell process is ever started. Same version Tauri already builds.
# WebView2 memory target while the flyout is hidden; same versions Tauri uses.
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Networking_NetworkListManager", "Win32_NetworkManagement_WindowsFirewall"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
native-tls = "0.2"
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
tauri-plugin-autostart = "2"
# MIT OR Apache-2.0. Advertises the LAN Remote Control service so phones can
# rediscover the PC at a stable `swapper.local` name after its IP changes.
mdns-sd = "0.21"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Full debug info makes Windows debug builds several GB of PDBs. Line tables
# keep file:line in panics and backtraces; dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
